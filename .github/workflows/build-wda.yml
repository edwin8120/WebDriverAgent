# appium/WebDriverAgent のフォークの .github/workflows/build-wda.yml に置く
name: Build WDA IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned, device)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'WebDriverAgentRunner-Runner.app' | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgentRunner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
